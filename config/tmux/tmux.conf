set -g default-terminal "tmux-256color"
# HEADS UP: `terminal-overrides ...:RGB` does NOT enable truecolor on tmux
# 3.2+. Verified on tmux 3.4 — with only the override set, RGB never shows up
# in #{client_termfeatures}. The line below is kept because it is harmless and
# terminal-overrides is still the right place for other capability tweaks, but
# it is NOT what gives you 24-bit colour.
set -ag terminal-overrides ",xterm-256color:RGB"

# THIS is the mechanism that actually works (tmux 3.2+): terminal-features,
# keyed on the OUTER terminal's TERM. Ghostty reports TERM=xterm-ghostty.
# Its terminfo declares Tc/setrgbf/setrgbb but not the standard RGB boolean,
# so tmux cannot auto-detect it and has to be told explicitly.
# Requires the xterm-ghostty terminfo entry, installed in ~/.terminfo.
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Undercurl + coloured underlines (neovim diagnostics). Ghostty supports both.
set -as terminal-features ",xterm-ghostty:usstyle"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection c"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

set-option -g default-shell /bin/zsh

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'dracula/tmux'

set -g @dracula-plugins "playerctl cpu-usage ram-usage"
set -g @dracula-playerctl-format "► {{ artist }} - {{ title }}"
set -g @dracula-show-powerline true
set -g @dracula-show-empty-plugins false
set -g @dracula-day-month true

# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# ── Pane borders (after tpm so we override Dracula) ─────────────────────────
set -g pane-border-style          'fg=#44475a'
set -g pane-active-border-style   'fg=#ff79c6'
set -g pane-border-status         top
set -g pane-border-format         '#{?pane_active,#[fg=#ff79c6 bold] #P: #{pane_current_command} #[default],#[fg=#44475a] #P: #{pane_current_command} #[default]}'

# ── Mouse wheel step (after tpm so nothing overrides it) ────────────────────
# tmux's built-in bindings scroll 5 rows per wheel notch, and tmux — not
# Ghostty — owns the wheel once you are inside a session. Ghostty's own
# mouse-scroll-multiplier only applies to its native scrollback outside tmux.
# 1 row per notch below; change the four -N 1 to -N 2 if it feels too slow.
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
